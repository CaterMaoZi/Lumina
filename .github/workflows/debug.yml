name: Gradle Tasks Debug (lumina-server)

on:
  workflow_dispatch:
  push:
    branches:
      - dev/1.21.6

jobs:
  list-tasks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew line endings and permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: List lumina-server jar-related tasks
        run: |
          ./gradlew :lumina-server:tasks --all | grep -i jar
